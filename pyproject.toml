[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "agentic-investing"
version = "2.0.0"
description = "Sistema Agentico de Inversion intradia (IBEX35 & S&P500) - nucleo deterministico y orquestacion multi-agente."
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "Cebrian Sierra David" }]
license = { text = "Proprietary" }

dependencies = [
    "pydantic>=2.6",
    "pydantic-settings>=2.2",
    "PyYAML>=6.0",
    "python-dotenv>=1.0",
    "tzdata>=2024.1",
]

[project.optional-dependencies]
# Dependencias para conectores/orquestacion reales (no necesarias para el nucleo deterministico ni los tests).
agents = [
    "langgraph>=0.2",
    "langchain-core>=0.2",
]
infra = [
    "redis>=5.0",
    "psycopg[binary]>=3.1",
    "qdrant-client>=1.9",
    "apscheduler>=3.10",
    "prometheus-client>=0.20",
]
connectors = [
    "ib-async>=1.0",
    "python-telegram-bot>=21.0",
    "httpx>=0.27",
]
llm = [
    "openai>=1.30",
    "anthropic>=0.30",
]
# Indicadores tecnicos para el buscador tecnico. Opcional: si no se instala, el modulo
# `indicators` degrada a una implementacion pura en Python (sin dependencias nativas).
indicators = [
    "pandas>=2.0",
    "pandas-ta>=0.3.14b",
]
# Panel de monitorizacion Streamlit (dashboard/app.py) que lee de Postgres.
dashboard = [
    "streamlit>=1.30",
    "streamlit-autorefresh>=1.0",
    "pandas>=2.0",
    "psycopg[binary]>=3.1",
]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5.0",
    "ruff>=0.4",
    "mypy>=1.10",
]

[project.scripts]
agentic = "src.app.main:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
addopts = "-ra"
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.mypy]
python_version = "3.11"
plugins = ["pydantic.mypy"]
ignore_missing_imports = true
