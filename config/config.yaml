hitl:
  channel: telegram
  approval_ttl_seconds: 600
  buttons: ["approve", "reject", "pause_1h"]

monitoring:
  pnl_review_minutes: 60
  stop_loss_check_minutes: 15

llm:
  provider: deepseek        # openai | azure_openai | anthropic | deepseek
  reasoning_model: deepseek-v4-flash  # razonamiento (evaluadores, buscadores)
  tool_model: deepseek-v4-flash           # tool calls / tareas ligeras
  temperature: 0.2
  max_tokens: 1024
  evaluation_engine: llm          # heuristic | llm
  prompts_dir: prompts

metrics:
  port: 8000
  bind_address: "0.0.0.0"  # todas las interfaces; Prometheus puede estar en otro host/contenedor
